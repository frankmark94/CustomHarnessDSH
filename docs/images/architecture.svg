<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#57606a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0969da"/>
    </marker>
    <style>
      .lane { fill:#f6f8fa; stroke:#d0d7de; }
      .laneTitle { font-size:14px; font-weight:700; fill:#24292f; letter-spacing:.02em; }
      .laneSub { font-size:11.5px; fill:#57606a; }
      .box { fill:#ffffff; stroke:#d0d7de; rx:8; }
      .ours { fill:#ddf4ff; stroke:#54aeff; }
      .vendor { fill:#fbefff; stroke:#c297ff; }
      .harness { fill:#ffffff; stroke:#8c959f; stroke-dasharray:4 3; }
      .ext { fill:#fff8c5; stroke:#d4a72c; }
      .t { fill:#24292f; }
      .tb { fill:#24292f; font-weight:600; }
      .ts { fill:#57606a; font-size:11px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:11px; fill:#0969da; }
      .flow { stroke:#57606a; stroke-width:1.3; fill:none; marker-end:url(#arrow); }
      .flowBlue { stroke:#0969da; stroke-width:1.6; fill:none; marker-end:url(#arrowBlue); }
      .label { font-size:10.5px; fill:#57606a; }
    </style>
  </defs>

  <!-- Title -->
  <text x="24" y="30" font-size="18" font-weight="700" fill="#24292f">CustomHarnessDSH — how the pieces fit</text>
  <text x="24" y="50" class="laneSub">A DeepSeek Harness home (DSH_HOME) extended by local plugins. Blue = ours, purple = vendored or installed third-party, dashed = harness services, yellow = outside the process.</text>

  <!-- Legend -->
  <rect x="860" y="16" width="14" height="14" class="ours" rx="3"/><text x="880" y="28" class="ts">our plugin</text>
  <rect x="950" y="16" width="14" height="14" class="vendor" rx="3"/><text x="970" y="28" class="ts">third-party</text>
  <rect x="1040" y="16" width="14" height="14" class="harness" rx="3"/><text x="1060" y="28" class="ts">harness</text>
  <rect x="1120" y="16" width="14" height="14" class="ext" rx="3"/><text x="1140" y="28" class="ts">external</text>

  <!-- ===== BROWSER LANE ===== -->
  <rect x="24" y="66" width="1192" height="196" class="lane" rx="10"/>
  <text x="40" y="90" class="laneTitle">BROWSER — web UI (React shell + hot-reloaded client modules)</text>
  <text x="40" y="106" class="laneSub">Each plugin ships a hand-written client.js and registers into a UI slot; the shell serves them from /plugins and reloads edits in ~500 ms.</text>

  <rect x="40" y="118" width="160" height="62" class="ours" rx="8"/>
  <text x="50" y="137" class="tb">Harness panel</text>
  <text x="50" y="152" class="ts">details column: now, issues,</text>
  <text x="50" y="166" class="ts">repo, tools, spend, turns</text>

  <rect x="212" y="118" width="140" height="62" class="ours" rx="8"/>
  <text x="222" y="137" class="tb">Git tab</text>
  <text x="222" y="152" class="ts">changes, diffs, blame,</text>
  <text x="222" y="166" class="ts">commits, branches</text>

  <rect x="364" y="118" width="160" height="62" class="ours" rx="8"/>
  <text x="374" y="137" class="tb">Composer controls</text>
  <text x="374" y="152" class="ts">Smart Router toggle</text>
  <text x="374" y="166" class="ts">Dictation mic + waveform</text>

  <rect x="536" y="118" width="160" height="62" class="ours" rx="8"/>
  <text x="546" y="137" class="tb">Settings pages</text>
  <text x="546" y="152" class="ts">Dictation page, OAuth card</text>
  <text x="546" y="166" class="ts">on the Models page</text>

  <rect x="708" y="118" width="150" height="62" class="vendor" rx="8"/>
  <text x="718" y="137" class="tb">Better sidebar</text>
  <text x="718" y="152" class="ts">files, terminal, side chat,</text>
  <text x="718" y="166" class="ts">git, subagents</text>

  <rect x="870" y="118" width="150" height="62" class="vendor" rx="8"/>
  <text x="880" y="137" class="tb">Context tab</text>
  <text x="880" y="152" class="ts">dsh-context: what the</text>
  <text x="880" y="166" class="ts">model is carrying</text>

  <rect x="1032" y="118" width="170" height="62" class="vendor" rx="8"/>
  <text x="1042" y="137" class="tb">Teams · Worktrees · Ledger</text>
  <text x="1042" y="152" class="ts">agent-teams UI, worktree</text>
  <text x="1042" y="166" class="ts">board, TokenLedger popover</text>

  <text x="40" y="206" class="ts">Reads live data two ways:</text>
  <rect x="40" y="214" width="540" height="36" class="box" rx="8"/>
  <text x="52" y="236" class="t"><tspan class="tb">useProjection(key)</tspan> — every changed projection view is pushed over the control stream</text>
  <rect x="596" y="214" width="606" height="36" class="box" rx="8"/>
  <text x="608" y="236" class="t"><tspan class="tb">fetch('/git-lens/…', '/dictation/…', '/provider-login/…', '/smart-router/…')</tspan> — cookie-gated host routes</text>

  <!-- arrows browser -> host -->
  <path d="M310 250 V 300" class="flowBlue"/>
  <text x="318" y="282" class="label">projections (push)</text>
  <path d="M900 250 V 300" class="flowBlue"/>
  <text x="908" y="282" class="label">HTTP (poll / POST), Host fence + signed cookie</text>

  <!-- ===== HOST LANE ===== -->
  <rect x="24" y="300" width="1192" height="446" class="lane" rx="10"/>
  <text x="40" y="324" class="laneTitle">HOST — node process, cordis composition from cordis.patch.yml + settings.yaml</text>
  <text x="40" y="340" class="laneSub">One plugin tree for every profile. Plugins are plain ES modules exporting name / inject / Config / apply.</text>

  <!-- Transport row -->
  <rect x="40" y="352" width="540" height="58" class="harness" rx="8"/>
  <text x="50" y="371" class="tb">Session projections</text>
  <text x="50" y="386" class="ts">pure folds over the session log, broadcast on change</text>
  <text x="50" y="401" class="mono">harnessPanel · costUsage · tokenUsage · contextPressure · todos</text>

  <rect x="596" y="352" width="606" height="58" class="harness" rx="8"/>
  <text x="606" y="371" class="tb">Web server routes  +  connection.requestRejection()</text>
  <text x="606" y="386" class="ts">prefix / exact routes registered by plugins; every request must carry the browser-session cookie</text>
  <text x="606" y="401" class="mono">/git-lens  /dictation  /provider-login  /smart-router/state</text>

  <!-- Request path -->
  <text x="40" y="440" class="tb">The request path (one model call)</text>

  <rect x="40" y="450" width="120" height="56" class="harness" rx="8"/>
  <text x="50" y="469" class="tb">Agent loop</text>
  <text x="50" y="484" class="ts">turn → steps → tools</text>
  <text x="50" y="498" class="ts">subagents, teams</text>

  <path d="M160 478 H 184" class="flow"/>
  <rect x="186" y="450" width="176" height="56" class="ours" rx="8"/>
  <text x="196" y="469" class="tb">model-router</text>
  <text x="196" y="484" class="ts">agent/request waterfall (prepend)</text>
  <text x="196" y="498" class="ts">fast / standard / reasoning tier</text>

  <path d="M362 478 H 386" class="flow"/>
  <rect x="388" y="450" width="204" height="56" class="ours" rx="8"/>
  <text x="398" y="469" class="tb">token-ledger · cost-governor</text>
  <text x="398" y="484" class="ts">llm/stream: price before, settle after;</text>
  <text x="398" y="498" class="ts">budget warn / hard action</text>

  <path d="M592 478 H 616" class="flow"/>
  <rect x="618" y="450" width="190" height="56" class="harness" rx="8"/>
  <text x="628" y="469" class="tb">pi-ai adapter</text>
  <text x="628" y="484" class="ts">provider profiles from settings.yaml;</text>
  <text x="628" y="498" class="ts">key or OAuth grant per route</text>

  <path d="M808 478 H 832" class="flow"/>
  <rect x="834" y="450" width="368" height="56" class="ext" rx="8"/>
  <text x="844" y="469" class="tb">Model providers</text>
  <text x="844" y="484" class="ts">OpenCode Go · GitHub Copilot (OAuth grant, refreshed by pi-ai)</text>
  <text x="844" y="498" class="ts">OpenCode Zen · DeepSeek · OpenRouter · any pi-ai catalog route</text>

  <!-- smart-router feeding router -->
  <rect x="186" y="522" width="176" height="40" class="ours" rx="8"/>
  <text x="196" y="539" class="tb">smart-router</text>
  <text x="196" y="553" class="ts">flips smartBridge.smartEnabled</text>
  <path d="M274 522 V 508" class="flow"/>

  <!-- ledger files -->
  <rect x="388" y="522" width="204" height="40" class="box" rx="8"/>
  <text x="398" y="539" class="tb">files under DSH_HOME</text>
  <text x="398" y="553" class="mono">decisions.jsonl · totals.json</text>
  <path d="M490 522 V 508" class="flow"/>

  <!-- authorization / credentials -->
  <rect x="618" y="522" width="190" height="40" class="harness" rx="8"/>
  <text x="628" y="539" class="tb">authorization + credentials</text>
  <text x="628" y="553" class="ts">device-code flows, .credentials.yaml</text>
  <path d="M713 522 V 508" class="flow"/>

  <rect x="834" y="522" width="190" height="40" class="ours" rx="8"/>
  <text x="844" y="539" class="tb">provider-login</text>
  <text x="844" y="553" class="ts">starts flows: code + link → grant</text>
  <path d="M834 542 H 810" class="flow"/>

  <!-- System prompt + tools row -->
  <text x="40" y="596" class="tb">What the model sees and can call</text>

  <rect x="40" y="606" width="196" height="56" class="harness" rx="8"/>
  <text x="50" y="625" class="tb">System prompt</text>
  <text x="50" y="640" class="ts">sections + dynamic contexts,</text>
  <text x="50" y="654" class="ts">workspace AGENTS.md / CLAUDE.md</text>

  <rect x="248" y="606" width="176" height="56" class="ours" rx="8"/>
  <text x="258" y="625" class="tb">claude-bridge</text>
  <text x="258" y="640" class="ts">memory for the session cwd,</text>
  <text x="258" y="654" class="ts">~/.claude/CLAUDE.md, skills</text>
  <path d="M248 634 H 236" class="flow"/>

  <rect x="436" y="606" width="156" height="56" class="harness" rx="8"/>
  <text x="446" y="625" class="tb">Tools registry</text>
  <text x="446" y="640" class="ts">read / edit / pwsh / grep …</text>
  <text x="446" y="654" class="ts">+ plugin tools</text>

  <rect x="604" y="606" width="176" height="56" class="vendor" rx="8"/>
  <text x="614" y="625" class="tb">session-search</text>
  <text x="614" y="640" class="mono">agent_session_search</text>
  <text x="614" y="654" class="mono">agent_session_read</text>
  <path d="M604 634 H 592" class="flow"/>

  <rect x="792" y="606" width="176" height="56" class="vendor" rx="8"/>
  <text x="802" y="625" class="tb">worktree · agent-teams</text>
  <text x="802" y="640" class="mono">subagent_worktree</text>
  <text x="802" y="654" class="ts">captain / member agents</text>
  <path d="M792 634 H 780" class="flow"/>

  <rect x="980" y="606" width="222" height="56" class="ours" rx="8"/>
  <text x="990" y="625" class="tb">git-lens · dictation (host halves)</text>
  <text x="990" y="640" class="ts">run git for the workspace; forward</text>
  <text x="990" y="654" class="ts">audio to the STT engine, key on host</text>

  <!-- Host-lane footnote -->
  <rect x="40" y="680" width="1162" height="50" class="box" rx="8"/>
  <text x="52" y="699" class="tb">Two hard-won rules</text>
  <text x="52" y="716" class="ts">1) Never append custom event types to a session — plugin state lives in files under DSH_HOME.   2) A prefix route is registered WITHOUT a trailing slash, and every route outside the RPC boundary checks the cookie itself.</text>

  <!-- arrows host -> external -->
  <path d="M120 746 V 782" class="flow"/>
  <path d="M440 746 V 782" class="flow"/>
  <path d="M760 746 V 782" class="flow"/>
  <path d="M1060 746 V 782" class="flow"/>

  <!-- ===== EXTERNAL LANE ===== -->
  <rect x="24" y="784" width="1192" height="96" class="lane" rx="10"/>
  <text x="40" y="808" class="laneTitle">OUTSIDE THE PROCESS</text>

  <rect x="40" y="820" width="200" height="46" class="ext" rx="8"/>
  <text x="50" y="838" class="tb">Workspace repos</text>
  <text x="50" y="853" class="ts">git, .dsh-worktrees/, .agent-teams/</text>

  <rect x="256" y="820" width="330" height="46" class="ext" rx="8"/>
  <text x="266" y="838" class="tb">Other agents' files</text>
  <text x="266" y="853" class="ts">~/.claude memory + skills · Codex, Claude Code, OpenCode logs</text>

  <rect x="602" y="820" width="300" height="46" class="ext" rx="8"/>
  <text x="612" y="838" class="tb">GitHub</text>
  <text x="612" y="853" class="ts">device-code OAuth for Copilot · remotes in the Git tab</text>

  <rect x="918" y="820" width="284" height="46" class="ext" rx="8"/>
  <text x="928" y="838" class="tb">Speech-to-text engines</text>
  <text x="928" y="853" class="ts">browser engine · OpenAI · Groq · Mistral · custom</text>
</svg>
