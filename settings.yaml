# DeepSeek Harness — settings
# Docs: https://github.com/deepseek-ai/deepseek-harness/blob/main/docs/user/guide/providers.md
#
# The API key is NOT stored here. It is read from the OPENROUTER_API_KEY
# environment variable, which start-dsh.cmd sets before launching.

llm-pi-ai:
  providers:
    # OpenCode Zen — pay-as-you-go credits. DeepSeek V4 works here without the
    # region opt-in, but a zero balance answers 401 "CreditsError", which the
    # harness shows as "API key is invalid".
    # OpenCode Go — the subscription. Same key. Rejects every request lacking
    # x-opencode-session (400 MissingSessionID); this harness build never sends
    # it, so a stable id is pinned here. DeepSeek V4 needs the China opt-in on Go.
    opencode-go:
      apiKeyEnv: OPENCODE_API_KEY
      headers: { x-opencode-session: dsh-frank-home }
    # GitHub Copilot — OAuth, not an API key. No apiKeyEnv on purpose: the route
    # authenticates from the OAuth grant stored after "Sign in with GitHub" on
    # the Models page (device-code flow: copy the code, approve on
    # github.com/login/device). pi-ai refreshes the Copilot token itself.
    github-copilot: {}
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: opencode-go # your $10/month plan. `opencode` (Zen) needs prepaid credits.
  model: glm-5.3 # the router re-picks the tier per call anyway
ui-theme:
  preference: dark
agent-presets:
  default: standard
