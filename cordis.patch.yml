# DeepSeek Harness — home-level patch layer ($DSH_HOME/cordis.patch.yml).
#
# The harness applies this file to EVERY profile (web, headless, …) after the
# bundle layers and the profile's own cordis.patch.yml. Rows are addressed by
# id; a row here replaces the target's whole `config`, so restate every key you
# want to keep. Edits apply live (patchReload: live) — no restart needed.
#
# Two local plugins live in ./plugins and are mounted here. Their `name` is a
# path relative to this file (the harness rewrites it to an absolute file URL
# when composing the profile).

- insert:
    # ── Model router ─────────────────────────────────────────────────────────
    # Picks a tier (fast / standard / reasoning) for every model call from the
    # prompt and the state of the turn, then routes to that tier's model on the
    # session's CURRENT provider. Add a `profiles.<provider>` block for each
    # provider you use; providers without a block are left untouched.
    # Runtime control from the chat: /router status | on | off | pin <tier> | auto
    - id: model-router
      name: ./plugins/model-router/index.js
      config:
        mode: auto                 # auto | off
        defaultTier: standard
        stickyWithinTurn: true     # keep step-1 tier for the whole turn (KV-cache friendly)
        escalateOnToolErrors: 2    # bump to reasoning after N errored tool calls in a turn (0 = never)
        auxiliaryTier: fast        # compaction summaries + session titles; `off` to leave them alone
        profiles:
          # OpenCode Go (current default provider in settings.yaml)
          # NOTE (2026-09-07): deepseek-v4-flash / deepseek-v4-pro on OpenCode Go
          # return 403 RegionError ("hosted in China, requires explicit opt in")
          # until you opt in at https://opencode.ai/workspace/<id>/go — the harness
          # shows that as "API key is invalid". Once opted in, swap them back:
          #   standard:  { model: deepseek-v4-flash }  # $0.22 / $0.66
          #   reasoning: { model: deepseek-v4-pro }    # $0.66 / $1.98
          opencode-go:
            fast:      { model: qwen3.8-flash }      # $0.15 / $0.47 per 1M in/out
            standard:  { model: minimax-m3 }         # $0.30 / $1.20, 1M ctx
            reasoning: { model: glm-5.3 }            # $1.40 / $4.40, 1M ctx
          # OpenCode Zen (pay-as-you-go credits, provider id `opencode`). Same key
          # as Go. DeepSeek V4 is not region-locked here. Needs a credit balance.
          opencode:
            fast:      { model: deepseek-v4-flash }  # $0.14 / $0.28 per 1M in/out
            standard:  { model: deepseek-v4-flash }
            reasoning: { model: deepseek-v4-pro }    # $0.435 / $0.87
          # Native DeepSeek platform key (the harness's built-in route)
          deepseek-official:
            fast:      { model: deepseek-v4-flash }  # $0.14 / $0.28
            standard:  { model: deepseek-v4-flash }
            reasoning: { model: deepseek-v4-pro }    # $0.435 / $0.87
          # GitHub Copilot (OAuth via provider-login; models are what your
          # subscription exposes — pi-ai filters the catalog by the grant)
          # Tiers must be models YOUR plan exposes (the grant's availableModelIds
          # in .credentials.yaml). Free Copilot (2026-09-09): gpt-5-mini,
          # gpt-5.6-luna, gpt-4.1, claude-haiku-4.5, mai-code-1.1-flash, …
          # A paid plan adds the Claude Sonnet/Opus and GPT-5.x models — swap then.
          # Probed 2026-09-09 with the stored free-plan token: only gpt-4.1 /
          # gpt-4o / gpt-4o-mini answer; gpt-5-mini, gpt-5.6-luna and
          # claude-haiku-4.5 return "model_not_supported" on every endpoint.
          # gpt-4.1 is the one of those in pi-ai's catalog, so all tiers use it
          # until the plan (or Copilot) exposes more — then split the tiers.
          github-copilot:
            fast:      { model: gpt-4.1 }            # list $2 / $8, 128k ctx
            standard:  { model: gpt-4.1 }
            reasoning: { model: gpt-4.1 }
          # OpenRouter (custom pi-ai provider, id `openrouter`)
          openrouter:
            fast:      { model: deepseek/deepseek-v4-flash }
            standard:  { model: deepseek/deepseek-chat }
            reasoning: { model: deepseek/deepseek-v4-pro }
        heuristics:
          shortPromptWords: 25
          longPromptWords: 120
        logDir: !!js dshHomePath('model-router')

    # ── Harness panel ────────────────────────────────────────────────────────
    # Right-hand live dashboard in the web UI (replaces the mostly-empty
    # "Details" column): what is running and for how long, model + router tier
    # and reasons, spend (actual vs expected, per model, today, all time),
    # context pressure, tool timeline with an inspector, plan progress, turn
    # history, and the last provider error with a plain-language hint.
    # Host half registers the `harnessPanel` session projection; the browser
    # half is plugins/harness-panel/client.js (hot-reloaded by the harness).
    - id: harness-panel
      name: ./plugins/harness-panel/index.js
      config:
        catalogProviders:
          opencode-go: opencode-go
          opencode: opencode
          deepseek-official: deepseek
          openrouter: openrouter
          github-copilot: github-copilot
        maxTools: 40
        maxTurns: 30
        argsChars: 600
        resultChars: 1500
        ledgerDir: !!js dshHomePath('token-ledger')

    # ── Session search (vendored third-party) ────────────────────────────────
    # Tieboyh/dsh-session-search, vendored under ./vendor (see its NOTICE).
    # Adds two model-facing tools: agent_session_search / agent_session_read —
    # a read-only, index-free literal search over past dsh, Codex, Claude Code
    # and OpenCode conversations on this machine. `roots.dsh` must point at
    # THIS home's sessions (the default is ~/.dsh/sessions). No ripgrep here,
    # so it parses every candidate file (fine at this corpus size).
    - id: dsh-session-search
      name: ./vendor/dsh-session-search/lib/index.js
      config:
        sources: { dsh: true, codex: true, claude: true, pi: false, opencode: true }
        roots:
          dsh: !!js dshHomePath('sessions')
        maxResults: 10
        readWindow: 10

    # ── Cost governor (vendored third-party) ─────────────────────────────────
    # yushuosun/dsh-cost-governor, built + vendored under ./vendor (NOTICE).
    # Accounting → pricing → budget → policy: registers the `costUsage`
    # projection and a `usageCost` service, warns at warnRatio of the period
    # budget and applies hardAction at hardRatio. Kept on notify-only until it
    # is wired to the model-router's tiers (steer-to-cheaper-model).
    - id: cost-governor
      name: ./vendor/dsh-cost-governor/lib/index.js
      config:
        currency: USD
        budget:
          period: monthly
          budgetUsd: 20
          warnRatio: 0.8
          hardRatio: 1.0
          hardAction: notify-only   # notify-only | block-new-requests | steer-to-cheaper-model
        notifyWebhook: ''

    # ── Claude bridge ────────────────────────────────────────────────────────
    # Injects Claude Code's memory for the SESSION'S workspace
    # (~/.claude/projects/<key>/memory/*.md), ~/.claude/CLAUDE.md and a skills
    # catalog into the system prompt. Adapted from YYTbit/dsh-plugin-claude-bridge
    # (MIT). NOTE: everything it reads is sent to the model provider.
    - id: claude-bridge
      name: ./plugins/claude-bridge/index.js
      config:
        claudeHome: ~/.claude
        enableMemory: true
        maxMemoryBytes: 8192
        enableGlobalInstructions: true
        enableSkills: true
        maxSkills: 30
        extraSkillDirs: ['~/.agents/skills']
        cacheMs: 3000

    # ── Git lens ─────────────────────────────────────────────────────────────
    # Git / GitHub adapter: read-only loopback routes under /git-lens/ run git
    # for the session's workspace (registered workspaces only, behind the same
    # browser-session cookie as the UI). The browser half adds a "Git" tab
    # beside Chat / Trajectory: remote + GitHub repo, branch, ahead/behind,
    # working tree with diffs, commits with patches, branches, stashes, blame.
    # The Harness panel shows a one-line repo summary from the same routes.
    - id: git-lens
      name: ./plugins/git-lens/index.js
      config:
        prefix: /git-lens/
        timeoutMs: 15000
        maxPatchBytes: 300000
        maxBlameLines: 3000
        restrictToWorkspaces: true

    # ── Provider login (OAuth / device code) ─────────────────────────────────
    # The pi-ai adapter registers an authorization flow for every catalog
    # provider with a login (GitHub Copilot: GitHub device-code OAuth), but this
    # web build never starts one. This plugin adds the surface: a "Sign in with
    # GitHub" control on the provider's card in Settings → Models (code + Copy
    # button + verification link, prompts, cancel, sign out), routes under
    # /provider-login/* (cookie-gated like git-lens) and `/login <provider>`.
    # The harness ships the authorization seam (`ctx.authorization`) but the
    # web bundle does not mount it — which is why no login flow could ever be
    # started. Mount it here; the pi-ai adapter registers its flows into it.
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'
      config: {}
    - id: provider-login
      name: ./plugins/provider-login/index.js
      config:
        prefix: /provider-login
        retainMs: 600000

    # ── Dictation ────────────────────────────────────────────────────────────
    # Settings → Dictation (enable, speech-to-text engine + model, language),
    # a mic button in the composer with a live waveform + real-time transcript,
    # and /dictation/* routes: audio is forwarded to the chosen engine with a
    # key resolved through the credentials service (never sent to the browser).
    # Engines: the browser's own speech recognition (no key), OpenAI / Groq /
    # Mistral transcription (available once their key is stored), or a custom
    # OpenAI-compatible endpoint. Settings in $DSH_HOME/dictation/settings.json.
    - id: dictation
      name: ./plugins/dictation/index.js
      config:
        prefix: /dictation
        settingsFile: !!js dshHomePath('dictation/settings.json')
        maxAudioBytes: 26214400
        timeoutMs: 60000

    # ── UI fixes ─────────────────────────────────────────────────────────────
    # Client-only CSS overrides for third-party UI plugins whose theme tokens
    # drifted from this harness build (TokenLedger's translucent popover).
    - id: ui-fixes
      name: ./plugins/ui-fixes/index.js
      config: {}

    # ── Smart Model Router ───────────────────────────────────────────────────
    # Chatbox button (bottom-right of the composer tool row, left of the model
    # picker) that toggles an "optimised orchestration" mode for the sibling
    # model-router plugin: main agent becomes capability-first (lower
    # reasoning threshold + escalation on the first errored tool), subagents
    # stay cost-first (dampened keyword hits, prefer fast/standard). State is
    # persisted in $DSH_HOME/smart-router/state.json and mirrored in /router
    # status. Toggle from chat: /smartrouter status|on|off.
    - id: smart-router
      name: ./plugins/smart-router/index.js
      config:
        stateFile: !!js dshHomePath('smart-router/state.json')
        defaultSmart: false

    # ── Token ledger ─────────────────────────────────────────────────────────
    # Prices every request before it is sent (system + tools + messages, plus a
    # per-model expected-output allowance), then reconciles with the provider's
    # reported usage. Running totals per session / model / day, in tokens and
    # USD (prices from the bundled model catalog; override under `pricing`).
    # From the chat: /tokens | /tokens all | /tokens last 10 | /tokens reset
    - id: token-ledger
      name: ./plugins/token-ledger/index.js
      config:
        announce: log              # log | silent  (per-call lines in the harness console)
        expectedOutputTokens: 600  # allowance before a model has history
        historyLimit: 200
        catalogProviders:
          deepseek-official: deepseek
        pricing: {}                # e.g. "openrouter/deepseek/deepseek-chat": { input: 0.26, output: 1.03 }
        ledgerDir: !!js dshHomePath('token-ledger')
